baseURL = "https://chenzhou0071.github.io/"
defaultContentLanguage = "zh-cn"
locale = "zh-cn"
title = "舟上码途"
theme = "PaperMod"
enableEmoji = true
enableRobotsTXT = true
paginate = 10
timeZone = "Asia/Shanghai"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "dracula"

[params]
  env = "production"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowRssButtonInSectionTermList = true
  description = "沉舟的技术手记：后端开发 / C 语言 / 网关 / 面试经验"

  [params.homeInfoParams]
    Title = "舟上码途"
    Content = "沉舟的技术手记。记录后端开发日志、项目复盘（Nexus Gateway）与面试经验。"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    limit = 10
    keys = ["title", "permalink", "summary"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/chenzhou0071"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 10

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 20

[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 30

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 40

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 50

[[menu.main]]
  identifier = "resume"
  name = "简历"
  url = "/resume/"
  weight = 60
